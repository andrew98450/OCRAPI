openapi: 3.1.0

info:
  title: OCR Recognition Service API
  version: 1.0.0
  description: |
    OCR RESTful Service

    Features:
      - Image OCR
      - PDF OCR
      - URL OCR
      - Base64 OCR
      - Layout Analysis
      - Table Extraction
      - Async Processing

servers:
  - url: https://api.example.com/v1
    description: Production

tags:
  - name: OCR
  - name: Jobs
  - name: Export

paths:

  /ocr/jobs:

    post:
      tags:
        - OCR

      summary: Create OCR Job

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object

              required:
                - file

              properties:

                file:
                  type: string
                  format: binary

                language:
                  type: string
                  example: chi_tra

                engine:
                  type: string
                  enum:
                    - paddleocr
                    - tesseract
                    - azure

                detect_table:
                  type: boolean
                  default: false

                detect_layout:
                  type: boolean
                  default: false

                callback_url:
                  type: string
                  format: uri

      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'

    get:
      tags:
        - Jobs

      summary: List OCR Jobs

      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1

        - in: query
          name: page_size
          schema:
            type: integer
            default: 20

        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/JobStatus'

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'

  /ocr/url:

    post:
      tags:
        - OCR

      summary: OCR From Image URL

      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - image_url

              type: object

              properties:

                image_url:
                  type: string
                  format: uri

                language:
                  type: string

      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'

  /ocr/base64:

    post:
      tags:
        - OCR

      summary: OCR From Base64

      requestBody:
        required: true
        content:
          application/json:
            schema:

              required:
                - image_base64

              type: object

              properties:

                image_base64:
                  type: string

                language:
                  type: string

      responses:
        "202":
          description: Accepted

  /ocr/pdf:

    post:
      tags:
        - OCR

      summary: OCR PDF

      requestBody:
        required: true

        content:
          multipart/form-data:
            schema:

              type: object

              required:
                - file

              properties:
                file:
                  type: string
                  format: binary

                pages:
                  type: array
                  items:
                    type: integer

      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'

  /ocr/jobs/{jobId}:

    get:
      tags:
        - Jobs

      summary: Get Job Status

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:

        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'

    delete:
      tags:
        - Jobs

      summary: Delete Job

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:
        "200":
          description: Deleted

  /ocr/jobs/{jobId}/result:

    get:
      tags:
        - OCR

      summary: OCR Result

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:

        "200":
          description: OCR Result

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRResult'

  /ocr/jobs/{jobId}/blocks:

    get:
      tags:
        - OCR

      summary: OCR Blocks

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:

        "200":
          description: OCR Blocks

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResponse'

  /ocr/jobs/{jobId}/tables:

    get:
      tags:
        - OCR

      summary: OCR Tables

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:

        "200":
          description: OCR Tables

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableResponse'

  /ocr/jobs/{jobId}/export/txt:

    get:
      tags:
        - Export

      summary: Export TXT

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:
        "200":
          description: txt file

  /ocr/jobs/{jobId}/export/json:

    get:
      tags:
        - Export

      summary: Export JSON

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:
        "200":
          description: json file

  /ocr/jobs/{jobId}/export/docx:

    get:
      tags:
        - Export

      summary: Export DOCX

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:
        "200":
          description: docx file

  /ocr/jobs/{jobId}/export/pdf:

    get:
      tags:
        - Export

      summary: Export Searchable PDF

      parameters:
        - $ref: '#/components/parameters/jobId'

      responses:
        "200":
          description: pdf file

components:

  parameters:

    jobId:
      in: path
      name: jobId
      required: true

      schema:
        type: string

  schemas:

    JobStatus:
      type: string

      enum:
        - pending
        - processing
        - completed
        - failed
        - expired

    JobResponse:
      type: object

      properties:

        job_id:
          type: string

        status:
          $ref: '#/components/schemas/JobStatus'

        created_at:
          type: string
          format: date-time

    JobStatusResponse:
      type: object

      properties:

        job_id:
          type: string

        status:
          $ref: '#/components/schemas/JobStatus'

        progress:
          type: integer
          minimum: 0
          maximum: 100

        created_at:
          type: string
          format: date-time

        completed_at:
          type: string
          format: date-time

    OCRResult:
      type: object

      properties:

        job_id:
          type: string

        file_name:
          type: string

        language:
          type: string

        confidence:
          type: number

        pages:
          type: integer

        text:
          type: string

    BoundingBox:
      type: object

      properties:

        x:
          type: integer

        y:
          type: integer

        width:
          type: integer

        height:
          type: integer

    OCRBlock:

      type: object

      properties:

        text:
          type: string

        confidence:
          type: number

        bbox:
          $ref: '#/components/schemas/BoundingBox'

    BlockResponse:
      type: object

      properties:

        job_id:
          type: string

        blocks:
          type: array
          items:
            $ref: '#/components/schemas/OCRBlock'

    OCRTable:

      type: object

      properties:

        table_id:
          type: integer

        rows:
          type: array
          items:
            type: array
            items:
              type: string

    TableResponse:

      type: object

      properties:

        tables:
          type: array
          items:
            $ref: '#/components/schemas/OCRTable'

    JobSummary:

      type: object

      properties:

        job_id:
          type: string

        file_name:
          type: string

        status:
          $ref: '#/components/schemas/JobStatus'

    JobListResponse:

      type: object

      properties:

        total:
          type: integer

        page:
          type: integer

        data:
          type: array

          items:
            $ref: '#/components/schemas/JobSummary'

  securitySchemes:

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []